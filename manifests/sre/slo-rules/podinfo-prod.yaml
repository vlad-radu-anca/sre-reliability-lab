  - name: sloth-slo-alerts-podinfo-latency
    rules:
    - alert: PodinfoProdSlow
      annotations:
        runbook_url: https://github.com/vlad-radu-anca/sre-reliability-lab/blob/main/runbooks/podinfo-latency.md
        summary: podinfo in prod is responding slowly.
        title: (page) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error budget
          burn rate is too fast.
      expr: |
        (
            max(slo:sli_error:ratio_rate5m{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"} > (14.4 * 0.01)) without (sloth_window)
            and
            max(slo:sli_error:ratio_rate1h{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"} > (14.4 * 0.01)) without (sloth_window)
        )
        or
        (
            max(slo:sli_error:ratio_rate30m{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"} > (6 * 0.01)) without (sloth_window)
            and
            max(slo:sli_error:ratio_rate6h{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"} > (6 * 0.01)) without (sloth_window)
        )
      labels:
        severity: page
        sloth_severity: page
    - alert: PodinfoProdSlow
      annotations:
        runbook_url: https://github.com/vlad-radu-anca/sre-reliability-lab/blob/main/runbooks/podinfo-latency.md
        summary: podinfo in prod is responding slowly.
        title: (ticket) {{$labels.sloth_service}} {{$labels.sloth_slo}} SLO error
          budget burn rate is too fast.
      expr: |
        (
            max(slo:sli_error:ratio_rate2h{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"} > (3 * 0.01)) without (sloth_window)
            and
            max(slo:sli_error:ratio_rate1d{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"} > (3 * 0.01)) without (sloth_window)
        )
        or
        (
            max(slo:sli_error:ratio_rate6h{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"} > (1 * 0.01)) without (sloth_window)
            and
            max(slo:sli_error:ratio_rate3d{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"} > (1 * 0.01)) without (sloth_window)
        )
      labels:
