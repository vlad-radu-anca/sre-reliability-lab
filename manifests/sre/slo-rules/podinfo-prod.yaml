        environment: prod
        owner: platform
        sloth_id: podinfo-latency
        sloth_service: podinfo
        sloth_slo: latency
      record: slo:time_period:days
    - expr: |
        slo:sli_error:ratio_rate5m{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"}
        / on(sloth_id, sloth_slo, sloth_service) group_left
        slo:error_budget:ratio{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"}
      labels:
        environment: prod
        owner: platform
        sloth_id: podinfo-latency
        sloth_service: podinfo
        sloth_slo: latency
      record: slo:current_burn_rate:ratio
    - expr: |
        slo:sli_error:ratio_rate30d{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"}
        / on(sloth_id, sloth_slo, sloth_service) group_left
        slo:error_budget:ratio{sloth_id="podinfo-latency", sloth_service="podinfo", sloth_slo="latency"}
      labels:
